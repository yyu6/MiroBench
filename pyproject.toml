[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-reddit-sim"
version = "0.1.0"
description = "Product-grounded Reddit discussion simulation and binary judging."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0.0",
  "python-dotenv>=1.0.1",
  "scipy>=1.10.0",
  "numpy>=1.24.0",
  "pandas>=2.0.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["product_reddit_sim", "calibration"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# `generalized_card/analysis/_wip_*.py` are verbatim scratch reproductions of the
# measurements behind `docs/DECISIONS.md` G31-G35. They are committed because rule
# E8 requires every claimed number to be reproducible from a committed script, and
# they are exempted from the line-style rules because rewriting them would change
# the code that produced the recorded numbers. Promote to a documented
# `analysis/<name>.py` before reusing any of them.
"generalized_card/analysis/_wip_*.py" = ["E401", "E402", "E701", "E702"]
