[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirobench"
version = "0.1.0"
description = "MiroBench: A Benchmark for Evaluating Synthetic Online Product Discussions"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "MiroBench Authors"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "torch>=2.0",
    "transformers>=4.30",
    "sentence-transformers>=2.2",
    "nltk>=3.8",
    "scikit-learn>=1.2",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
mirobench = "mirobench.cli:main"

[tool.setuptools.packages.find]
include = ["mirobench*"]

[tool.setuptools.package-data]
mirobench = ["data/**/*.csv", "data/**/*.json"]
