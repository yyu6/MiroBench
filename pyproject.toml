[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirobench"
version = "0.1.0"
description = "MiroBench: A Benchmark for Evaluating Synthetic Online Product Discussions"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "MiroBench Authors"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "torch>=2.0",
    "transformers>=4.30",
    "sentence-transformers>=2.2",
    "bert-score>=0.3.13",
    "detoxify>=0.5",
    "nltk>=3.8",
    "scikit-learn>=1.2",
    "python-dotenv>=1.0",
    "openai>=1.0",
    "httpx>=0.24",
]

[project.optional-dependencies]
# Pulls in the OASIS Reddit simulation engine for `mirobench generate`.
# Pinned to the versions used to produce the leaderboard.
generation = [
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
]
dev = ["pytest", "ruff"]

[project.scripts]
mirobench = "mirobench.cli:main"

[tool.setuptools.packages.find]
include = ["mirobench*", "calibration*"]

[tool.setuptools.package-data]
mirobench = ["data/**/*.csv", "data/**/*.json"]
