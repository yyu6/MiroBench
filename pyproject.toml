[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-reddit-sim"
version = "0.1.0"
description = "Product-grounded Reddit discussion simulation and binary judging."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0.0",
  "python-dotenv>=1.0.1",
  "scipy>=1.10.0",
  "numpy>=1.24.0",
  "pandas>=2.0.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["product_reddit_sim", "calibration"]

[tool.pytest.ini_options]
testpaths = ["tests"]
